<div class="section-container">
  <div class="section-header">
    <h3><i class="fa-solid fa-star"></i> Reviews Dashboard</h3>
  </div>

  <!-- Summary -->
  <div class="summary-grid">
    <div class="summary-card blue">
      <div class="summary-icon"><i class="fa-solid fa-comments"></i></div>
      <div>
        <span class="summary-label">Total Reviews</span>
        <span class="summary-value">{{ reviews.length }}</span>
      </div>
    </div>
    <div class="summary-card green">
      <div class="summary-icon"><i class="fa-solid fa-star"></i></div>
      <div>
        <span class="summary-label">Average Rating</span>
        <span class="summary-value">{{ averageRating.toFixed(1) }} <small>/ 5</small></span>
      </div>
    </div>
  </div>

  <!-- Reviews List -->
  <h4 class="sub-title"><i class="fa-solid fa-quote-left"></i> Customer Reviews</h4>
  <div class="review-list">
    <div *ngFor="let review of reviews" class="review-card">
      <div class="review-avatar">
        {{ review.tenant.charAt(0) }}
      </div>
      <div class="review-content">
        <div class="review-header">
          <h5>{{ review.tenant }}</h5>
          <div class="stars">
            <i *ngFor="let star of [1,2,3,4,5]" class="fa-solid fa-star"
              [class.filled]="star <= review.rating"
              [class.empty]="star > review.rating"></i>
          </div>
        </div>
        <p class="review-property"><i class="fa-solid fa-building"></i> {{ review.property }}</p>
        <p class="review-text">{{ review.feedback }}</p>
      </div>
    </div>
  </div>
</div>
