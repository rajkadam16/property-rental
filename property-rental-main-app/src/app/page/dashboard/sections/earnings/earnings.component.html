<div class="section-container">
  <div class="section-header">
    <h3><i class="fa-solid fa-indian-rupee-sign"></i> Earnings Overview</h3>
  </div>

  <!-- Summary Cards -->
  <div class="summary-grid">
    <div class="summary-card green">
      <div class="summary-icon"><i class="fa-solid fa-wallet"></i></div>
      <div>
        <span class="summary-label">Total Earnings</span>
        <span class="summary-value">₹{{ totalEarnings | number }}</span>
      </div>
    </div>
    <div class="summary-card amber">
      <div class="summary-icon"><i class="fa-solid fa-hourglass-half"></i></div>
      <div>
        <span class="summary-label">Pending Payments</span>
        <span class="summary-value">₹{{ pendingPayments | number }}</span>
      </div>
    </div>
    <div class="summary-card blue">
      <div class="summary-icon"><i class="fa-solid fa-receipt"></i></div>
      <div>
        <span class="summary-label">Transactions</span>
        <span class="summary-value">{{ transactions.length }}</span>
      </div>
    </div>
  </div>

  <!-- Transaction List -->
  <h4 class="sub-title"><i class="fa-solid fa-list"></i> Recent Transactions</h4>
  <div class="transaction-list">
    <div *ngFor="let t of transactions" class="transaction-row">
      <div class="transaction-info">
        <div class="transaction-avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <h5>{{ t.tenant }}</h5>
          <p><i class="fa-solid fa-building"></i> {{ t.property }} &middot; {{ t.date }}</p>
        </div>
      </div>
      <div class="transaction-amount">₹{{ t.amount | number }}</div>
      <span class="status-pill" [class.paid]="t.status === 'Paid'" [class.pending]="t.status === 'Pending'">
        {{ t.status }}
      </span>
    </div>
  </div>
</div>
