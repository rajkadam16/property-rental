<div class="section-container">
  <div class="section-header">
    <h3><i class="fa-solid fa-calendar-check"></i> Booking Management</h3>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <button class="filter-btn" [class.active]="activeFilter === 'all'" (click)="filterStatus('all')">All</button>
    <button class="filter-btn pending" [class.active]="activeFilter === 'pending'" (click)="filterStatus('pending')">Pending</button>
    <button class="filter-btn accepted" [class.active]="activeFilter === 'accepted'" (click)="filterStatus('accepted')">Accepted</button>
    <button class="filter-btn rejected" [class.active]="activeFilter === 'rejected'" (click)="filterStatus('rejected')">Rejected</button>
  </div>

  <!-- Booking Cards -->
  <div *ngIf="filteredBookings.length === 0" class="empty-state">
    <i class="fa-solid fa-calendar-xmark"></i>
    <p>No bookings found</p>
  </div>

  <div class="booking-list">
    <div *ngFor="let booking of filteredBookings" class="booking-card">
      <div class="booking-avatar">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="booking-info">
        <h4>{{ booking.tenant }}</h4>
        <p><i class="fa-solid fa-building"></i> {{ booking.property }}</p>
        <p class="booking-date"><i class="fa-regular fa-calendar"></i> {{ booking.date }}</p>
      </div>
      <div class="booking-status">
        <span class="status-pill"
          [class.pending]="booking.status === 'Pending'"
          [class.accepted]="booking.status === 'Accepted'"
          [class.rejected]="booking.status === 'Rejected'">
          {{ booking.status }}
        </span>
      </div>
      <div *ngIf="booking.status === 'Pending'" class="booking-actions">
        <button class="action-btn accept" (click)="updateStatus(booking, 'Accepted')">
          <i class="fa-solid fa-check"></i>
        </button>
        <button class="action-btn reject" (click)="updateStatus(booking, 'Rejected')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>
</div>
