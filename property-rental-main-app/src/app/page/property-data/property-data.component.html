
<div class="property-details-page">
  <!-- Top: Image Gallery / Carousel Section -->
  <section class="gallery-section">
      <ng-container *ngIf="primaryGallery">
        <app-image-carousel [data]="primaryGallery" [imageStyle]="carouselImageStyle"></app-image-carousel>
      </ng-container>
  </section>

  <!-- Main Content Area -->
  <div class="details-container">
    <div class="details-grid">
      
      <!-- Main Column (Left) -->
      <main class="main-column">
        <!-- Core Apartment Info (Title, Rent, Specs) -->
        <div class="card-section info-card">
          <app-appartment-data [apartmentData]="product" [floorplandetails]="product" [unitsData]="product"></app-appartment-data>
        </div>

        <!-- About section -->
        <section class="card-section content-section">
          <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-circle-info"></i> About Property</h2>
          </div>
          <div class="section-body">
            <app-property-data-additional-info [additionalInfo]="aboutProperty"></app-property-data-additional-info>
          </div>
        </section>
      
        <!-- Features section -->
        <section class="card-section content-section">
          <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-sliders"></i> Premium Features</h2>
          </div>
          <div class="section-body">
            <app-property-data-facilities [propertyDetalisList]="apartmentFeatures"></app-property-data-facilities>
          </div>
        </section>
      
        <!-- Neighborhood Section -->
        <section class="card-section content-section">
          <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-map-location-dot"></i> Neighborhood</h2>
          </div>
          <div class="section-body">
            <app-property-data-additional-info [additionalInfo]="propertyNeighborHood"></app-property-data-additional-info>
          </div>
        </section>
      
        <!-- Education / Amenities grid -->
        <div class="amenities-grid">
          <section class="card-section grid-section">
            <div class="section-header">
              <h2 class="section-title"><i class="fa-solid fa-graduation-cap"></i> Nearby Education</h2>
            </div>
            <app-property-school-card [schoolData]="propertyEducation"></app-property-school-card>
          </section>
        
          <section class="card-section grid-section">
            <div class="section-header">
              <h2 class="section-title"><i class="fa-solid fa-bus"></i> Transportation</h2>
            </div>
            <app-property-school-card [schoolData]="transportations"></app-property-school-card>
          </section>
        
          <section class="card-section grid-section full-width">
            <div class="section-header">
              <h2 class="section-title"><i class="fa-solid fa-hospital"></i> Healthcare Services</h2>
            </div>
            <app-property-school-card [schoolData]="hospitals"></app-property-school-card>
          </section>
        </div>
      </main>

      <!-- Sidebar Column (Right) -->
      <aside class="sidebar-column">
        <div class="sticky-sidebar">
          <app-contact-property [propertyContact]="product"></app-contact-property>
        </div>
      </aside>

    </div>
  </div>
</div>
