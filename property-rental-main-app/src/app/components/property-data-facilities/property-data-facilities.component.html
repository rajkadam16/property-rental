
<div class="features-grid-system" *ngIf="facilities?.features">
  <div class="feature-item-modern" *ngFor="let property of facilities.features">
    <div class="feature-bullet">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <span class="feature-text">{{ property || "Feature Not Specified" }}</span>
  </div>
</div>
