<div class="modal fade" id="requestTour" tabindex="-1" aria-labelledby="tourModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered custom-modal-dialog">
    <div class="modal-content premium-modal">
      <div class="modal-header modal-header-custom">
        <h5 class="modal-title" id="tourModalLabel">
          <i class="fa-solid fa-calendar-check text-purple"></i> Request a Tour
        </h5>
        <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="modal-body p-0">
        <div class="modal-form-wrapper">
          <p class="modal-subtitle">Property: <strong>{{propertyInfo?.propertyDetails?.name}}</strong></p>
          
          <form [formGroup]="requestTourForm" (ngSubmit)="onSubmit();sendEmail()">
            
            <div class="input-grid">
              <div class="form-group">
                <label>First Name</label>
                <div class="input-with-icon">
                  <i class="fa-regular fa-user"></i>
                  <input type="text" placeholder="John" formControlName="firstName" />
                </div>
                <small class="error-text" *ngIf="requestTourForm.controls['firstName'].touched && requestTourForm.controls['firstName'].hasError('required')">Required</small>
              </div>
              
              <div class="form-group">
                <label>Last Name</label>
                <div class="input-with-icon">
                  <i class="fa-regular fa-user"></i>
                  <input type="text" placeholder="Doe" formControlName="lastName" />
                </div>
                <small class="error-text" *ngIf="requestTourForm.controls['lastName'].touched && requestTourForm.controls['lastName'].hasError('required')">Required</small>
              </div>
            </div>

            <div class="form-group">
              <label>Email Address</label>
              <div class="input-with-icon">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="john@example.com" formControlName="email" />
              </div>
              <small class="error-text" *ngIf="requestTourForm.controls['email'].touched && requestTourForm.controls['email'].hasError('required')">Required</small>
            </div>

            <div class="input-grid">
              <div class="form-group">
                <label>Preferred Date</label>
                <div class="input-with-icon">
                  <i class="fa-regular fa-calendar"></i>
                  <input type="date" formControlName="date" />
                </div>
                <small class="error-text" *ngIf="requestTourForm.controls['date'].touched && requestTourForm.controls['date'].hasError('required')">Required</small>
              </div>
              
              <div class="form-group">
                <label>Contact Number</label>
                <div class="input-with-icon">
                  <i class="fa-solid fa-phone"></i>
                  <input type="tel" formControlName="phone" placeholder="9876543210" />
                </div>
                <small class="error-text" *ngIf="requestTourForm.controls['phone'].touched && requestTourForm.controls['phone'].hasError('required')">Required</small>
              </div>
            </div>

            <div class="form-group mt-3">
              <label>I would like to...</label>
              <div class="checkbox-options">
                <label class="custom-check">
                  <input type="checkbox" value="schedule a tour" />
                  <span class="chk-box"></span> Schedule a tour
                </label>
                <label class="custom-check">
                  <input type="checkbox" value="Request Application" />
                  <span class="chk-box"></span> Request Application
                </label>
                <label class="custom-check">
                  <input type="checkbox" value="Confirm availability" />
                  <span class="chk-box"></span> Confirm Availability
                </label>
              </div>
            </div>

            <div class="form-group term-check">
              <label class="custom-check mt-3">
                <input type="checkbox" formControlName="acceptTerms" />
                <span class="chk-box"></span> Email me listings and apartments related info
              </label>
            </div>

            <div class="modal-footer-actions">
              <button type="submit" class="btn-gradient-submit" [disabled]="requestTourForm.invalid">
                Submit Request <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
