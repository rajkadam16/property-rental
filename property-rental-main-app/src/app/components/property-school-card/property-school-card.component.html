
<div class="nearby-amenities-list">
  <div class="amenity-card" *ngFor="let data of school?.details">
    <div class="amenity-info">
      <div class="amenity-header">
        <h3 class="amenity-name">{{ data.name || "Not Available" }}</h3>
        <span class="amenity-type badge">{{ data.type || "Nearby" }}</span>
      </div>
      <div class="amenity-meta">
        <span class="meta-item"><i class="fa-solid fa-map-marker-alt"></i> {{ data.address || "Location not provided" }}</span>
        <span class="meta-item"><i class="fa-solid fa-person-walking"></i> {{ data.distance || "N/A" }} from property</span>
      </div>
    </div>
    <div class="amenity-rating">
      <div class="rating-circle">
        <span class="rating-val">{{ data.rating || '—' }}</span>
        <span class="rating-label">/10</span>
      </div>
      <div class="rating-text">Rating</div>
    </div>
  </div>
</div>
