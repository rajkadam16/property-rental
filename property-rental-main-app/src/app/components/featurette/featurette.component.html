
<div class="featurettes-wrapper">
  <div *ngFor="let featurette of featuretteData; let i = index" 
    class="featurette-item" 
    [class.reverse]="i % 2 !== 0">
    
    <div *ngIf="featurette.isEnabled" class="featurette-content-row">
      <!-- Text Content -->
      <div class="featurette-text">
        <span class="feature-index">0{{ i + 1 }}</span>
        <h2 class="featurette-heading">{{ featurette.heading1 || "Not Available" }}</h2>
        <p class="featurette-desc">{{ featurette.text || "Not Available" }}</p>
        <div class="feature-actions" *ngIf="i === 0">
          <button class="btn-info-action" routerLink="/FindProperty">Get Started <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>

      <!-- Image -->
      <div class="featurette-img-box">
        <div class="img-accent-bg"></div>
        <img [src]="featurette.image" alt="Featurette" />
      </div>
    </div>
  </div>
</div>
