<div class="modal fade" id="sendMessage" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered custom-modal-dialog">
    <div class="modal-content premium-modal">
      <div class="modal-header modal-header-custom">
        <h5 class="modal-title" id="messageModalLabel">
          <i class="fa-solid fa-paper-plane text-purple"></i> Send Message
        </h5>
        <button type="button" class="btn-close-custom" data-bs-dismiss="modal" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="modal-body p-0">
        <div class="modal-form-wrapper">
          <p class="modal-subtitle">To: <strong>Property Manager ({{propertyInfo?.propertyDetails?.name}})</strong></p>
          
          <form [formGroup]="sendMessage" (ngSubmit)="onSubmit()">
            
            <div class="input-grid">
              <div class="form-group">
                <label>First Name</label>
                <div class="input-with-icon">
                  <i class="fa-regular fa-user"></i>
                  <input type="text" placeholder="John" formControlName="firstName" />
                </div>
                <small class="error-text" *ngIf="sendMessage.controls['firstName'].touched && sendMessage.controls['firstName'].hasError('required')">Required</small>
              </div>
              
              <div class="form-group">
                <label>Last Name</label>
                <div class="input-with-icon">
                  <i class="fa-regular fa-user"></i>
                  <input type="text" placeholder="Doe" formControlName="lastName" />
                </div>
                <small class="error-text" *ngIf="sendMessage.controls['lastName'].touched && sendMessage.controls['lastName'].hasError('required')">Required</small>
              </div>
            </div>

            <div class="form-group">
              <label>Email Address</label>
              <div class="input-with-icon">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="john@example.com" formControlName="email" />
              </div>
              <small class="error-text" *ngIf="sendMessage.controls['email'].touched && sendMessage.controls['email'].hasError('required')">Required</small>
            </div>

            <div class="input-grid">
              <div class="form-group">
                <label>Preferred Contact Date</label>
                <div class="input-with-icon">
                  <i class="fa-regular fa-calendar"></i>
                  <input type="date" formControlName="tourDate" />
                </div>
                <small class="error-text" *ngIf="sendMessage.controls['tourDate'].touched && sendMessage.controls['tourDate'].hasError('required')">Required</small>
              </div>
              
              <div class="form-group">
                <label>Contact Number</label>
                <div class="input-with-icon">
                  <i class="fa-solid fa-phone"></i>
                  <input type="tel" formControlName="phoneNumber" placeholder="9876543210" />
                </div>
                <small class="error-text" *ngIf="sendMessage.controls['phoneNumber'].touched && sendMessage.controls['phoneNumber'].hasError('required')">Required</small>
              </div>
            </div>

            <div class="form-group">
              <label>Message</label>
              <div class="input-with-icon">
                <i class="fa-regular fa-comment-dots" style="top: 24px;"></i>
                <textarea formControlName="coustomMessage" placeholder="Hello, I am interested in this property..."></textarea>
              </div>
            </div>

            <div class="form-group term-check">
              <label class="custom-check mt-2">
                <input type="checkbox" formControlName="acceptTerms" />
                <span class="chk-box"></span> Email me listings and apartments related info
              </label>
            </div>

            <div class="modal-footer-actions">
              <button type="submit" class="btn-gradient-submit" [disabled]="sendMessage.invalid" (click)="sendEmail();reset()">
                Send Message <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
